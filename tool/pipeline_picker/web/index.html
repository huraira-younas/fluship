<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluship pipeline</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <p class="brand-kicker">Fluship</p>
          <h1>Pipeline</h1>
        </div>
      </div>
      <p class="top-count" id="count">0 selected</p>
    </header>

    <p class="intro" id="lede">Choose the app, turn on only the jobs for this run, then start.</p>

    <section class="card" aria-labelledby="app-title">
      <div class="card-head">
        <h2 id="app-title">App</h2>
        <p class="status" id="project-status" role="status"></p>
      </div>
      <label class="field">
        <span>Recent</span>
        <select id="recent"></select>
      </label>
      <div class="path-row">
        <label class="field grow">
          <span>Folder</span>
          <input id="path" type="text" spellcheck="false" placeholder="/path/to/flutter/app" autocomplete="off">
        </label>
        <button type="button" class="btn" id="browse">Browse</button>
        <button type="button" class="btn" id="validate">Check</button>
      </div>
      <div class="meta">
        <label class="field">
          <span>Version</span>
          <input id="version" type="text" spellcheck="false" placeholder="1.0.0">
        </label>
        <label class="field">
          <span>Build</span>
          <input id="buildNumber" type="text" spellcheck="false" placeholder="1">
        </label>
        <label class="field">
          <span>Branch</span>
          <input id="gitBranch" type="text" spellcheck="false" placeholder="master">
        </label>
        <label class="field">
          <span>WhatsApp</span>
          <input id="whatsappNumber" type="tel" spellcheck="false" placeholder="+923096547269" autocomplete="off">
        </label>
      </div>
    </section>

    <section class="card" aria-labelledby="setup-title">
      <div class="card-head">
        <h2 id="setup-title">Setup</h2>
        <p class="status" id="secrets-status" role="status"></p>
      </div>
      <p class="hint">Add your store keys, Drive, Slack, and Gmail once. They stay on this machine and unlock the dimmed jobs below.</p>
      <div id="secret-groups"></div>
      <div class="setup-actions">
        <button type="button" class="btn" id="save-secrets">Save keys</button>
      </div>
    </section>

    <section class="jobs-wrap" aria-labelledby="jobs-title">
      <div class="card-head">
        <h2 id="jobs-title">Jobs</h2>
        <p class="hint">Turn on what you want. Dimmed rows need setup first.</p>
      </div>
      <div id="groups"></div>
    </section>

    <footer class="dock">
      <p class="picked" id="picked">Nothing selected</p>
      <div class="dock-actions">
        <button type="button" class="btn" id="cancel">Cancel</button>
        <button type="button" class="btn primary" id="submit" disabled>Start</button>
      </div>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
